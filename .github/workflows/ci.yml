name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (vet + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: backend/go.sum

      - name: Download modules
        run: go mod download

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -race -covermode=atomic -coverprofile=coverage.out

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.out
          if-no-files-found: ignore

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error

  embedded-binary:
    name: Build self-contained binary
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build (front-end embedded)
        run: ./scripts/build.sh

      - name: Check shell scripts
        run: |
          sh -n scripts/install.sh
          sh -n scripts/build.sh
          sh -n scripts/dev.sh

      - name: Show version
        run: ./bin/mongoui -version

      - name: Smoke test the embedded UI
        run: |
          set -euo pipefail
          ./bin/mongoui -addr 127.0.0.1:18099 -data /tmp/mongoui-ci &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:18099/api/health && break
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:18099/api/health | grep -q '"uiEmbedded":true'
          curl -fsS http://127.0.0.1:18099/ | grep -q 'MongoUI'
          # The embedded build must be the freshly built one: this bootstrap
          # script only exists in the current front-end build.
          curl -fsS http://127.0.0.1:18099/ | grep -q 'mongoui-theme'
          # Every asset referenced by the shell must resolve.
          for asset in $(curl -fsS http://127.0.0.1:18099/ | grep -oE '/assets/[^"]+'); do
            curl -fsS -o /dev/null "http://127.0.0.1:18099${asset}"
          done
          # The shell must be revalidated so upgrades are picked up at once.
          curl -fsSI http://127.0.0.1:18099/ | grep -qi 'cache-control: no-cache'

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: mongoui-linux-amd64
          path: bin/mongoui
          if-no-files-found: error
