name: CI

on:
  push:
    branches: ["main", "master"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (vet + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: backend/go.sum

      - name: Download modules
        run: go mod download

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

      - name: Test
        run: go test ./... -race -covermode=atomic -coverprofile=coverage.out

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.out
          if-no-files-found: ignore

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags are needed to check the package version

      - name: Verify version matches the release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          echo "tag=$tag package=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::frontend/package.json ($pkg) is out of sync with tag $GITHUB_REF_NAME. Run ./scripts/sync-version.sh."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error

  embedded-binary:
    name: Build self-contained binary
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build (front-end embedded)
        run: ./scripts/build.sh

      - name: Check shell scripts
        run: |
          sh -n scripts/install.sh
          sh -n scripts/build.sh
          sh -n scripts/dev.sh

      - name: Show version
        run: ./bin/mongoui -version

      - name: Smoke test the embedded UI
        run: |
          set -euo pipefail
          ./bin/mongoui -addr 127.0.0.1:18099 -data /tmp/mongoui-ci &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:18099/api/health && break
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:18099/api/health | grep -q '"uiEmbedded":true'
          curl -fsS http://127.0.0.1:18099/ | grep -q 'MongoUI'
          # The embedded build must be the freshly built one: this bootstrap
          # script only exists in the current front-end build.
          curl -fsS http://127.0.0.1:18099/ | grep -q 'mongoui-theme'
          # The embedded front-end must carry the same version as the binary, so
          # a stale dist can never be shipped silently.
          version=$(./bin/mongoui -version | awk '{print $2}')
          version=${version#v}
          asset=$(grep -oE '/assets/index-[^"]+\.js' backend/web/dist/index.html | head -n1)
          # Avoid `gzip | grep -q` under pipefail: grep -q closes the pipe early
          # and gzip dies with SIGPIPE, failing the step spuriously.
          gzip -dc "backend/web/dist${asset}.gz" > /tmp/mongoui-ui.js
          grep -q "$version" /tmp/mongoui-ui.js
          echo "embedded UI version: $version"
          # Every asset referenced by the shell must resolve.
          for asset in $(curl -fsS http://127.0.0.1:18099/ | grep -oE '/assets/[^"]+'); do
            curl -fsS -o /dev/null "http://127.0.0.1:18099${asset}"
          done
          # The shell must be revalidated so upgrades are picked up at once.
          curl -fsSI http://127.0.0.1:18099/ | grep -qi 'cache-control: no-cache'

      - name: Check size budget
        run: |
          set -euo pipefail
          binary=$(wc -c < bin/mongoui)
          ui=$(du -sb backend/web/dist | cut -f1)
          echo "binary: $binary bytes; embedded UI: $ui bytes"
          if [ "$binary" -gt 14000000 ]; then
            echo "::error::binary grew past 14 MB ($binary bytes) — trim before merging"
            exit 1
          fi
          if [ "$ui" -gt 350000 ]; then
            echo "::error::embedded UI grew past 350 KB ($ui bytes) — keep assets gzipped / trim the bundle"
            exit 1
          fi

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: mongoui-linux-amd64
          path: bin/mongoui
          if-no-files-found: error

  docker:
    name: Docker image (build + smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build --build-arg APP_VERSION=ci -t mongoui:ci .

      - name: Smoke test the container
        run: |
          set -euo pipefail
          docker run -d --name mongoui-ci -p 18098:8080 mongoui:ci
          trap 'docker rm -f mongoui-ci' EXIT
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:18098/api/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:18098/api/health | grep -q '"uiEmbedded":true'
          curl -fsS http://127.0.0.1:18098/ | grep -q 'mongoui-theme'
          # MCP endpoint is served by the container too.
          curl -fsS http://127.0.0.1:18098/mcp \
            -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize"}' | grep -q '"name":"mongoui"'
