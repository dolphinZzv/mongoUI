name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      snapshot:
        description: "Build a snapshot (no GitHub release)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history for the changelog

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          cache-dependency-path: backend/go.sum

      - uses: pnpm/action-setup@v6
        with:
          version: "12.15.0"

      - uses: actions/setup-node@v7
        with:
          node-version: "26.12.1"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Run GoReleaser (release)
        if: ${{ github.event_name == 'push' || inputs.snapshot == false }}
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

      - name: Run GoReleaser (snapshot)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.snapshot == true }}
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

      - name: Upload release artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: goreleaser-dist
          path: dist
          if-no-files-found: ignore
