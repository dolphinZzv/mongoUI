# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
#
# GoReleaser configuration.
# Docs: https://goreleaser.com
#
# The release workflow builds the React front-end first, stages it into
# backend/web/dist (which is embedded via go:embed) and only then compiles the
# Go binary, so every release artifact is a fully self-contained server.
version: 2

project_name: mongoui

before:
  hooks:
    # Keep the front-end package version in lockstep with the release tag so no
    # tooling can ever stamp/serve a stale 0.1.0-era build again.
    - sh -c "./scripts/sync-version.sh {{ .Version }}"
    - sh -c "cd frontend && npm ci"
    - sh -c "cd frontend && VITE_APP_VERSION={{ .Version }} npm run build"
    - sh -c "find backend/web/dist -mindepth 1 ! -name .gitkeep -delete && cp -r frontend/dist/. backend/web/dist/"
    # Compress JS/CSS so the embedded payload stays small.
    - sh -c "./scripts/gzip-assets.sh backend/web/dist"
    # Fail the release if the freshly staged front-end is not the real one.
    - sh -c "grep -q 'mongoui-theme' backend/web/dist/index.html"

builds:
  - id: mongoui
    dir: backend
    main: .
    binary: mongoui
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .Date }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: mongoui
    ids:
      - mongoui
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md

# Homebrew formula with a `brew services` definition. It is pushed to a tap
# when HOMEBREW_TAP_GITHUB_TOKEN is configured; otherwise the formula is still
# generated under dist/ but not uploaded, so a missing tap never fails a
# release. One-time setup: create <owner>/homebrew-tap and add the token as a
# repository secret.
brews:
  - name: mongoui
    ids:
      - mongoui
    repository:
      owner: dolphinZzv
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    skip_upload: '{{ if .Env.HOMEBREW_TAP_GITHUB_TOKEN }}false{{ else }}true{{ end }}'
    directory: Formula
    homepage: https://github.com/dolphinZzv/mongoUI
    description: "Lightweight, self-hosted MongoDB web admin console"
    install: |
      bin.install "mongoui"
    service: |
      run [opt_bin/"mongoui", "-addr", "127.0.0.1:8080", "-data", var/"mongoui"]
      working_dir var
      log_path var/"log/mongoui.log"
      error_log_path var/"log/mongoui.log"
      keep_alive true
    test: |
      system "#{bin}/mongoui", "-version"

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "merge conflict"
      - Merge pull request
      - Merge remote-tracking branch
      - Merge branch
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Performance
      regexp: '^.*?perf(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: Others
      order: 999

release:
  draft: false
  prerelease: auto
  name_template: "{{ .ProjectName }} {{ .Tag }}"
  footer: |
    ## Docker / binary

    Download the archive for your platform, then run:

    ```bash
    tar -xzf mongoui_{{ .Version }}_linux_amd64.tar.gz
    ./mongoui -addr :8080
    ```

    The React front-end is embedded in the binary — no extra files required.
